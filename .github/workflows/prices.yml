name: Atualizar OHLC ETFs

on:
  workflow_dispatch:
  schedule:
    - cron: '20 23 * * 1-5'

permissions:
  contents: write

concurrency:
  group: atualizar-precos
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Atualizar cotações
        run: python scripts/refresh_prices.py

      - name: Guardar e publicar CSV
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preservar os CSV produzidos nesta execução.
          mkdir -p "$RUNNER_TEMP/etf_prices"
          cp data/*.csv "$RUNNER_TEMP/etf_prices/"

          # Atualizar a cópia de trabalho antes de cada tentativa de publicação.
          for attempt in 1 2 3 4 5; do
            echo "Tentativa de publicação: $attempt"
            git fetch origin main
            git reset --hard origin/main

            mkdir -p data
            cp "$RUNNER_TEMP/etf_prices/"*.csv data/
            git add data/

            if git diff --cached --quiet; then
              echo "Sem alterações: históricos já atualizados."
              exit 0
            fi

            git commit -m "Atualizar cotações OHLC"

            if git push origin HEAD:main; then
              echo "Atualização concluída com sucesso."
              exit 0
            fi

            sleep 5
          done

          echo "Falha ao publicar após 5 tentativas."
          exit 1
