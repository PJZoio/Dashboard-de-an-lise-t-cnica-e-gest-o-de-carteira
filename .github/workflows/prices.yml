name: Atualizar OHLC ETFs
on:
  workflow_dispatch:
  schedule:
    - cron: '20 23 * * 1-5' # UTC; consultar após fecho EUA. Pode atrasar.
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/refresh_prices.py
      - name: Commit apenas novos CSV
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/*.csv        
      - name: Guardar históricos atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Atualizar cotações OHLC"
          git pull --rebase origin main
          git push origin HEAD:main

concurrency:
  group: atualizar-precos
  cancel-in-progress: false
